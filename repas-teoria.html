<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posa't a prova · Economia Bàsica 4t ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#1E2235; --muted:#5A6079; --line:#D8DCE8; --ok:#1F9461; --bad:#D2452F; --soft:#EAEEF7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11131D; --card:#1A1D2B; --ink:#E8EAF4; --muted:#A3A8C2; --line:#2D3147; --soft:#23273A; --ok:#45C08A; --bad:#F06A50; }
}
:root[data-theme="dark"]{ --bg:#11131D; --card:#1A1D2B; --ink:#E8EAF4; --muted:#A3A8C2; --line:#2D3147; --soft:#23273A; --ok:#45C08A; --bad:#F06A50; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.06rem/1.65 "Lexend",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2;font-weight:800}
.wrap{max-width:820px;margin:0 auto;padding:1.4rem 1rem 4rem}
button{font:600 1rem "Lexend",sans-serif;border:0;border-radius:12px;padding:.65rem 1.1rem;cursor:pointer;background:var(--ink);color:var(--bg)}
button.soft{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
button.acc{background:var(--c,#3B5BDB);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--c,#3B5BDB);outline-offset:2px}
.top h1{font-size:clamp(1.8rem,4.6vw,2.6rem)}
.top p{color:var(--muted);margin:.4rem 0 0;max-width:60ch}

/* Unit cards with progress rings: the memorable element */
.units{display:grid;gap:.9rem;margin-top:1.4rem}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:1rem 1.1rem;font-weight:400}
.unit:hover{border-color:var(--c)}
.unit h2{font-size:1.2rem}
.unit p{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.badge{font-size:1.6rem}

.bar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.crumbs{color:var(--muted);font-size:.95rem}
.steps{display:flex;gap:6px;margin:1rem 0}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps i.done{background:var(--c)}
.steps i.now{background:var(--c);opacity:.45}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1.3rem 1.4rem;margin-top:.6rem}
.lesson h2{font-size:1.5rem;margin-bottom:.6rem;color:var(--c)}
.lesson p{margin:.6rem 0;max-width:66ch}
.lesson ul{margin:.4rem 0;padding-left:1.2rem}
.lesson li{margin:.25rem 0}
.ex{background:var(--soft);border-radius:14px;padding:.8rem 1rem;margin:.9rem 0}
.ex b:first-child{color:var(--c)}
.formula{font-weight:800;font-size:1.15rem;background:var(--soft);border-left:5px solid var(--c);border-radius:0 12px 12px 0;padding:.6rem .9rem;margin:.8rem 0}
.check{margin-top:1.2rem;border-top:2px dashed var(--line);padding-top:1rem}
.check h3{font-size:1.05rem;color:var(--muted);font-weight:600}
.check .q{font-weight:600;margin:.3rem 0 .7rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:var(--soft);color:var(--ink);font-weight:400;border:2px solid transparent}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;opacity:.85}
.fb{margin-top:.8rem;font-weight:600;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink);margin-top:.2rem}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.tabs button[aria-pressed="true"]{background:var(--c);color:#fff}

.flash{perspective:1000px;margin-top:1rem}
.fcard{width:100%;min-height:220px;border-radius:20px;background:var(--card);border:2px solid var(--line);color:var(--ink);display:grid;place-items:center;padding:1.5rem;text-align:center;font-weight:400}
.fcard .term{font-size:1.7rem;font-weight:800;color:var(--c)}
.fcard .def{font-size:1.1rem;max-width:46ch}
.fcard small{display:block;color:var(--muted);margin-top:.8rem;font-size:.85rem}
.score{font-size:3rem;font-weight:800;color:var(--c)}
.code{background:var(--soft);border-radius:12px;padding:.8rem 1rem;font-weight:600;user-select:all}
@media (prefers-reduced-motion:no-preference){.lesson{animation:in .25s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const U=[
{id:"u1",t:"Unitat 1 · El problema",e:"🏝️",c:"#3B5BDB",
 secs:[
  {t:"Escassetat o repartiment?",h:`<p>Les necessitats són <b>il·limitades</b> i els recursos, <b>limitats</b>: això és l'<b>escassetat</b>. Però a <i>L'illa de les flors</i> sobren tomàquets i hi ha persones que no en mengen: això és un <b>problema de repartiment</b>. Hi ha prou recursos, però no arriben a tothom perquè no tenen diners, propietat o accés.</p>
   <div class="ex"><b>Exemple.</b> La cooperativa ven melmelada a 5 €. Els veïns que només pagarien 4 € o menys <b>queden fora del mercat</b>, encara que hi hagi melmelada per a tothom.</div>`,
   q:{p:"Els supermercats llencen fruita bona mentre hi ha famílies que no en poden comprar. És un problema de…",o:["Escassetat","Repartiment","Productivitat"],a:1,x:"Hi ha prou fruita; el problema és que no arriba a tothom."}},
  {t:"Cost d'oportunitat i costos irrecuperables",h:`<p>El <b>cost d'oportunitat</b> és el valor de la <b>millor alternativa</b> a què renuncies quan tries.</p>
   <p>Un <b>cost irrecuperable</b> és un diner o temps que ja has gastat i que no tornarà, decideixis el que decideixis. Per això <b>no s'ha de tenir en compte</b> per decidir.</p>
   <div class="ex"><b>Exemple.</b> Vau pagar 50 € per una parada a la fira i no els tornen. Per decidir si hi aneu, només compten el que vendreu i el que gastareu a partir d'ara.</div>`,
   q:{p:"Vas pagar 30 € per una entrada que no et tornen i el mateix dia et conviden a un pla que t'agrada més. Els 30 €…",o:["T'obliguen a anar al concert per no perdre'ls","No han de comptar: ja estan gastats igualment","Són el teu cost d'oportunitat"],a:1,x:"És un cost irrecuperable: no tornarà facis el que facis."}},
  {t:"Pensar al marge i els incentius",h:`<p>L'<b>anàlisi marginal</b> és decidir pensant en <b>una unitat més</b>: una hora més, un producte més. Val la pena continuar mentre el que guanyes de més sigui igual o més gran que el que et costa de més.</p>
   <p>Un <b>incentiu</b> és una recompensa o un càstig que fa canviar el comportament. L'<b>equitat</b> també importa: al joc de l'ultimàtum, molta gent rebutja repartiments injustos.</p>`,
   q:{p:"Obrir la parada una hora més fa vendre 15 € més i costa 18 €. Val la pena?",o:["Sí","No","Només si plou"],a:1,x:"El benefici marginal (15 €) és més petit que el cost marginal (18 €)."}},
  {t:"Positiu o normatiu? Micro o macro?",h:`<ul><li><b>Positiu:</b> fets que es poden comprovar amb dades. <b>Normatiu:</b> opinions sobre el que hauria de ser.</li>
   <li><b>Micro:</b> decisions de famílies, empreses o mercats concrets. <b>Macro:</b> l'economia d'un país (atur, inflació, PIB).</li></ul>`,
   q:{p:"«Les botigues haurien de donar el menjar que sobra» és una afirmació…",o:["Positiva","Normativa","Macroeconòmica"],a:1,x:"Expressa una opinió sobre el que hauria de ser."}},
  {t:"Què, com i per a qui · factors de producció",h:`<p>Tota economia decideix <b>què</b> produir, <b>com</b> produir-ho i <b>per a qui</b>, buscant <b>eficiència</b> (no malbaratar) i <b>equitat</b> (repartiment just).</p>
   <p>Els <b>factors de producció</b> són la <b>terra</b> (recursos naturals), el <b>treball</b>, el <b>capital</b> (màquines, eines, edificis) i la <b>iniciativa empresarial</b>.</p>`,
   q:{p:"La màquina de cosir de la cooperativa és…",o:["Terra","Treball","Capital","Iniciativa empresarial"],a:2,x:"Les eines i màquines que serveixen per produir són capital."}},
  {t:"Economies plurals, drets i deures",h:`<ul><li><b>Circular:</b> reutilitzar, reparar i reciclar.</li><li><b>Ecològica:</b> respectar els límits del planeta.</li><li><b>Feminista i de les cures:</b> comptar el treball de cures, encara que no surti al PIB.</li><li><b>Social i solidària:</b> les persones per davant del benefici, com les cooperatives.</li></ul>
   <p>Les persones consumidores tenim <b>drets</b> (informació, reclamar) i <b>deures</b> (pagar impostos, consumir de manera responsable).</p>`,
   q:{p:"Una botiga que repara mòbils perquè no es llencin és un exemple d'economia…",o:["Circular","Feminista i de les cures","Macroeconòmica"],a:0,x:"Allargar la vida dels productes és economia circular."}}
 ],
 cards:[["Escassetat","Recursos limitats davant de necessitats il·limitades."],["Problema de repartiment","Hi ha prou recursos, però no arriben a tothom."],["Cost d'oportunitat","Valor de la millor alternativa a què renuncies."],["Cost irrecuperable","Diner o temps ja gastat que no tornarà: no ha de comptar per decidir."],["Anàlisi marginal","Decidir pensant en una unitat més."],["Incentiu","Recompensa o càstig que fa canviar el comportament."],["Normatiu","Afirmació que expressa el que hauria de ser."],["Macroeconomia","Estudi de l'economia d'un país en conjunt."],["Capital","Màquines, eines i edificis per produir."],["Economia circular","Reutilitzar, reparar i reciclar perquè res no es llenci."]],
 extra:[
  {p:"«L'atur juvenil ha baixat aquest any» és…",o:["Micro i normatiu","Macro i positiu","Micro i positiu"],a:1,x:"Parla de tot el país (macro) i es pot comprovar amb dades (positiu)."},
  {p:"Cuinar el sopar a casa compta al PIB?",o:["Sí","No"],a:1,x:"El PIB només compta el que es compra i es ven, però cuinar és treball de cures."},
  {p:"Quina remuneració rep el treball?",o:["Renda","Salari","Interès","Benefici"],a:1,x:"El treball es remunera amb un salari."}
 ]},
{id:"u2",t:"Unitat 2 · El mercat",e:"📊",c:"#0F8B8D",
 secs:[
  {t:"Productivitat i divisió del treball",h:`<div class="formula">Productivitat = producció ÷ factor utilitzat</div>
   <p>Quan cada persona s'especialitza en una tasca (<b>divisió del treball</b>), la productivitat sol augmentar.</p>
   <div class="ex"><b>Exemple.</b> 3 persones fan 24 sobres: 8 per persona. Repartint tasques en fan 48: 16 per persona, un 100 % més.</div>`,
   q:{p:"4 persones fan 32 bosses en una hora. Quina és la productivitat per persona?",o:["4 bosses","8 bosses","128 bosses"],a:1,x:"32 ÷ 4 = 8 bosses per persona."}},
  {t:"Recursos i desenvolupament sostenible",h:`<p>Els recursos <b>renovables</b> es regeneren (sol, vent, cotó) i els <b>no renovables</b> s'esgoten (petroli, gas, minerals). El <b>desenvolupament sostenible</b> satisfà les necessitats d'avui sense posar en perill les de demà.</p>`,
   q:{p:"El liti de les bateries és un recurs…",o:["Renovable","No renovable"],a:1,x:"És un mineral: s'esgota."}},
  {t:"Demanda i oferta",h:`<p><b>Llei de la demanda:</b> si el preu puja, la quantitat demandada baixa. <b>Llei de l'oferta:</b> si el preu puja, la quantitat oferta augmenta.</p>`,
   q:{p:"Si el preu de les bosses puja, la quantitat que volen comprar els clients…",o:["Augmenta","Baixa","No canvia"],a:1,x:"Llei de la demanda."}},
  {t:"L'equilibri del mercat",h:`<p>El <b>preu d'equilibri</b> és on la quantitat demandada és igual a l'oferta. Per sobre hi ha <b>excés d'oferta</b> (sobra producte i el preu baixa); per sota, <b>excés de demanda</b> (falta producte i el preu puja).</p>`,
   q:{p:"A 3 € es volen comprar 50 unitats i només se n'ofereixen 30. Què hi ha?",o:["Excés d'oferta","Excés de demanda","Equilibri"],a:1,x:"Es demana més del que s'ofereix: el preu tendirà a pujar."}},
  {t:"Desplaçaments de les corbes",h:`<p>Si canvia un factor dels <b>compradors</b> (renda, gustos, modes, festes), es desplaça la <b>demanda</b>. Si canvia un factor dels <b>productors</b> (costos, tecnologia, clima), es desplaça l'<b>oferta</b>.</p>`,
   q:{p:"La tela s'encareix molt. Què passa?",o:["Augmenta la demanda","Baixa l'oferta i el preu puja","Baixa la demanda"],a:1,x:"Un cost de producció més alt redueix l'oferta."}},
  {t:"Flux circular i enquesta",h:`<p>Al <b>flux circular</b>, les famílies compren béns a les empreses i els ofereixen treball a canvi de salaris; el sector públic cobra impostos i ofereix serveis.</p>
   <p>Amb l'<b>enquesta</b> («Quant pagaries com a màxim?»), a cada preu compren tots els que pagarien aquest preu <b>o més</b>. Ingressos previstos = preu × quantitat.</p>`,
   q:{p:"Enquesta: 3 persones pagarien com a màxim 2 €, 5 persones 3 € i 4 persones 4 €. Quantes comprarien a 3 €?",o:["5","9","12"],a:1,x:"Els de 3 € i els de 4 €: 5 + 4 = 9."}}
 ],
 cards:[["Productivitat","Producció ÷ factor utilitzat."],["Divisió del treball","Cada persona s'especialitza en una tasca."],["Recurs no renovable","Recurs que s'esgota: petroli, gas, minerals."],["Desenvolupament sostenible","Satisfer les necessitats d'avui sense comprometre les de demà."],["Preu d'equilibri","Preu on quantitat demandada = quantitat oferta."],["Excés d'oferta","Sobra producte: el preu tendeix a baixar."],["Excés de demanda","Falta producte: el preu tendeix a pujar."],["Flux circular de la renda","Circuit de béns, treball i diners entre famílies i empreses."]],
 extra:[
  {p:"Una influencer posa de moda les bosses reciclades. Quina corba es desplaça?",o:["L'oferta","La demanda","Cap"],a:1,x:"Una moda afecta els compradors."},
  {p:"Quan treballes en una empresa a canvi d'un sou, actues en…",o:["El mercat de béns","El mercat de factors"],a:1,x:"Ofereixes treball, un factor de producció."},
  {p:"Amb el preu de 4 € compren 13 persones. Quins són els ingressos previstos?",o:["17 €","52 €","9 €"],a:1,x:"4 × 13 = 52 €."}
 ]},
{id:"u3",t:"Unitat 3 · El pla",e:"📈",c:"#C2410C",
 secs:[
  {t:"Costos i cost total",h:`<p><b>Costos fixos</b>: es paguen igual encara que no produeixis (lloguer, assegurança). <b>Costos variables</b>: augmenten amb la producció (material).</p>
   <div class="formula">Cost total = CF + CVu × quantitat</div>`,
   q:{p:"CF = 100 €, CVu = 2 €. Cost total de fer 50 unitats?",o:["150 €","200 €","102 €"],a:1,x:"100 + 2 × 50 = 200 €."}},
  {t:"Benefici i punt mort",h:`<div class="formula">Benefici = preu × quantitat − cost total</div>
   <div class="formula">Punt mort = CF ÷ (preu − CVu)</div>
   <div class="ex"><b>Espelmes Corbatera.</b> CF 115 €, preu 8 €, CVu 2,80 €. Marge 5,20 €; punt mort 115 ÷ 5,20 = 22,1 → <b>23 espelmes</b>.</div>`,
   q:{p:"CF = 300 €, preu = 10 €, CVu = 4 €. Punt mort?",o:["30 unitats","50 unitats","75 unitats"],a:1,x:"300 ÷ 6 = 50 unitats."}},
  {t:"Tres escenaris",h:`<p>El <b>pla de viabilitat</b> calcula el resultat en tres escenaris: <b>pessimista</b>, <b>realista</b> i <b>optimista</b>. Si fins i tot el pessimista supera el punt mort, el projecte és molt segur.</p>`,
   q:{p:"Punt mort: 30 unitats. Escenaris: 25, 40 i 60. Quin dona pèrdues?",o:["Cap","El pessimista","Tots"],a:1,x:"Només el pessimista (25) queda per sota del punt mort."}},
  {t:"Formes jurídiques",h:`<ul><li><b>Autònom/a:</b> responsabilitat il·limitada.</li><li><b>SL:</b> des d'1 € de capital; responsabilitat limitada (si el capital és de menys de 3.000 €, fins a 3.000 €).</li><li><b>SA:</b> capital mínim de 60.000 € en accions.</li><li><b>Cooperativa catalana:</b> capital mínim de 3.000 €, responsabilitat limitada i un soci, un vot.</li></ul>`,
   q:{p:"Quin capital mínim cal per constituir una cooperativa a Catalunya?",o:["1 €","3.000 €","60.000 €"],a:1,x:"3.000 € (la SL, 1 €; la SA, 60.000 €)."}},
  {t:"La cooperativa i l'organigrama",h:`<p>Principis cooperatius: adhesió voluntària, <b>gestió democràtica (un soci, un vot)</b>, participació econòmica, formació i compromís amb la comunitat.</p>
   <p>Elements de l'empresa: persones, capital, organització (organigrama) i entorn. Rols de la cooperativa: Coordinació, Dades, Tresoreria i Comunicació.</p>`,
   q:{p:"Qui calcula el punt mort i porta els comptes a la cooperativa?",o:["Coordinació","Dades","Tresoreria","Comunicació"],a:2,x:"La tresoreria porta els números."}},
  {t:"RSC i rentat verd",h:`<p>La <b>RSC</b> són compromisos amb les persones i el planeta més enllà de la llei. El <b>rentat verd</b> és dir-se ecològic sense proves. Un bon compromís és <b>mesurable</b>: què, quant i quan.</p>`,
   q:{p:"Quin compromís és mesurable?",o:["Serem molt sostenibles","Reutilitzarem 50 pots aquest trimestre","Cuidarem el planeta"],a:1,x:"Diu què, quant i quan."}}
 ],
 cards:[["Cost fix","No canvia amb la quantitat produïda."],["Cost total","CF + CVu × quantitat."],["Punt mort","CF ÷ (preu − CVu): ni es guanya ni es perd."],["Escenari pessimista","Previsió de vendes baixes per comprovar la viabilitat."],["Responsabilitat il·limitada","Respondre dels deutes amb els béns personals."],["Un soci, un vot","Gestió democràtica de les cooperatives."],["Organigrama","Esquema de qui fa què a l'empresa."],["Rentat verd","Presentar-se com a ecològic sense proves."]],
 extra:[
  {p:"Un autònom no pot pagar un deute del negoci. Amb què respon?",o:["Només amb el negoci","També amb els seus béns personals","Paga l'Estat"],a:1,x:"Té responsabilitat il·limitada."},
  {p:"Venem 30 unitats a 5 € i el cost total és de 170 €. Resultat?",o:["Benefici de 20 €","Pèrdues de 20 €","Benefici de 150 €"],a:1,x:"150 − 170 = −20 €."},
  {p:"«100 % natural» en lletres verdes sense cap dada és…",o:["RSC","Rentat verd","Un compromís mesurable"],a:1,x:"No hi ha proves: és rentat verd."}
 ]}
];

const KEY="repas-teoria-v2";
let P={done:{},best:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.done) P=s; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} };
const app=document.getElementById("app");
let view={v:"home"};

function pct(u){ const d=u.secs.filter((_,i)=>P.done[u.id+"-"+i]).length; const r=(P.best[u.id]||0)>=4?1:0; return Math.round((d+r)/(u.secs.length+1)*100); }
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function go(v){ view=v; render(); scrollTo({top:0}); }

function render(){
  if(view.v==="home") return home();
  const u=U.find(x=>x.id===view.u); app.style.setProperty("--c",u.c); document.body.style.setProperty("--c",u.c);
  ({sec:lesson, cards:cards, quiz:quiz})[view.v](u);
}

function home(){
  const tot=Math.round(U.reduce((a,u)=>a+pct(u),0)/U.length);
  app.innerHTML=`<header class="top"><h1>Posa't a prova</h1>
    <p>Repassa cada unitat de la SA «Res no es llença», comprova que l'has entesa i supera el repte final. Avances al teu ritme i el progrés es guarda en aquest ordinador.</p></header>
    <div class="units">${U.map(u=>{ const p=pct(u), m=(P.best[u.id]||0)>=4;
      return `<button class="unit" style="--c:${u.c}" data-u="${u.id}">
        <div class="ring" style="--p:${p}"><span>${p}%</span></div>
        <div><h2>${u.e} ${u.t}</h2><p>${u.secs.length} apartats · targetes · repte${P.best[u.id]!==undefined?` · millor resultat ${P.best[u.id]}/5`:""}</p></div>
        <span class="badge" aria-label="${m?"Unitat superada":""}">${m?"🏅":""}</span></button>`; }).join("")}</div>
    <section class="lesson" style="margin-top:1.4rem">
      <h2 style="color:var(--ink)">El teu progrés: ${tot} %</h2>
      <p>Copia aquesta línia a Classroom quan t'ho demani la professora:</p>
      <div class="code">${U.map(u=>`${u.e} ${pct(u)}%${(P.best[u.id]||0)>=4?" 🏅":""}`).join(" · ")}</div>
    </section>`;
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const u=U.find(x=>x.id===b.dataset.u); let i=u.secs.findIndex((_,k)=>!P.done[u.id+"-"+k]); if(i<0) i=0;
    go({v:"sec",u:u.id,i});
  });
}

function head(u,active){
  return `<div class="bar"><button class="soft" data-home>← Temes</button><span class="crumbs">${u.e} ${u.t}</span></div>
  <div class="tabs">
    <button class="soft" data-tab="sec" aria-pressed="${active==="sec"}">Teoria</button>
    <button class="soft" data-tab="cards" aria-pressed="${active==="cards"}">Targetes</button>
    <button class="soft" data-tab="quiz" aria-pressed="${active==="quiz"}">Repte final</button></div>`;
}
function wire(u){
  app.querySelector("[data-home]").onclick=()=>go({v:"home"});
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.tab;
    if(t==="sec") go({v:"sec",u:u.id,i:0});
    if(t==="cards") go({v:"cards",u:u.id,k:0,flip:false,order:shuffle(u.cards.map((_,i)=>i))});
    if(t==="quiz") go({v:"quiz",u:u.id,qs:shuffle([...u.secs.map(s=>s.q),...u.extra]).slice(0,5),k:0,score:0,ans:null});
  });
}

function lesson(u){
  const i=view.i, s=u.secs[i], done=!!P.done[u.id+"-"+i];
  app.innerHTML=head(u,"sec")+`
   <div class="steps">${u.secs.map((_,k)=>`<i class="${P.done[u.id+"-"+k]?"done":k===i?"now":""}"></i>`).join("")}</div>
   <article class="lesson">
     <h2>${i+1}. ${s.t}</h2>${s.h}
     <div class="check"><h3>Comprova-ho</h3><div class="q">${s.q.p}</div>
       <div class="opts">${s.q.o.map((o,k)=>`<button class="opt${done&&k===s.q.a?" right":""}" data-k="${k}" ${done?"disabled":""}>${o}</button>`).join("")}</div>
       <div class="fb${done?" ok":""}" id="fb" aria-live="polite">${done?`Correcte!<span>${s.q.x}</span>`:""}</div></div>
   </article>
   <div class="nav">
     <button class="soft" id="prev" ${i===0?"disabled":""}>Apartat anterior</button>
     ${i<u.secs.length-1?`<button class="acc" id="next" ${done?"":"disabled"}>Apartat següent</button>`:`<button class="acc" id="toQuiz" ${done?"":"disabled"}>Fes el repte final</button>`}
   </div>`;
  wire(u);
  let tries=0;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, fb=document.getElementById("fb");
    if(k===s.q.a){
      b.classList.add("right"); app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      fb.className="fb ok"; fb.innerHTML=`Correcte!<span>${s.q.x}</span>`;
      P.done[u.id+"-"+i]=true; save();
      const n=document.getElementById("next")||document.getElementById("toQuiz"); n.disabled=false; n.focus();
    } else {
      tries++; b.classList.add("wrong"); b.disabled=true;
      fb.className="fb no"; fb.innerHTML= tries>=2 ? `Encara no.<span>Pista: ${s.q.x.split(":")[0]}. Rellegeix l'apartat i torna-ho a provar.</span>` : `No és correcte. Torna a llegir l'apartat i prova una altra resposta.`;
    }
  });
  document.getElementById("prev").onclick=()=>go({v:"sec",u:u.id,i:i-1});
  const n=document.getElementById("next"); if(n) n.onclick=()=>go({v:"sec",u:u.id,i:i+1});
  const q=document.getElementById("toQuiz"); if(q) q.onclick=()=>app.querySelector('[data-tab="quiz"]').click();
}

function cards(u){
  const k=view.k, c=u.cards[view.order[k]];
  app.innerHTML=head(u,"cards")+`
    <p class="note" style="color:var(--muted);margin-top:1rem">Intenta recordar la definició abans de girar la targeta.</p>
    <div class="flash"><button class="fcard" id="fc" aria-live="polite">${view.flip?`<div><div class="def">${c[1]}</div><small>${c[0]}</small></div>`:`<div><div class="term">${c[0]}</div><small>Toca per girar</small></div>`}</button></div>
    <div class="nav"><button class="soft" id="cp" ${k===0?"disabled":""}>Anterior</button><span class="crumbs">${k+1} / ${u.cards.length}</span><button class="acc" id="cn">${k<u.cards.length-1?"Següent":"Torna a començar"}</button></div>`;
  wire(u);
  document.getElementById("fc").onclick=()=>{ view.flip=!view.flip; render(); document.getElementById("fc").focus(); };
  document.getElementById("cp").onclick=()=>{ view.k--; view.flip=false; render(); };
  document.getElementById("cn").onclick=()=>{ if(view.k<u.cards.length-1){ view.k++; } else { view.k=0; view.order=shuffle(view.order); } view.flip=false; render(); };
}

function quiz(u){
  const V=view;
  if(V.k>=V.qs.length){
    const prev=P.best[u.id]; if(prev===undefined||V.score>prev){ P.best[u.id]=V.score; save(); }
    const ok=V.score>=4;
    app.innerHTML=head(u,"quiz")+`<section class="lesson" style="text-align:center">
      <div class="score">${V.score} / 5</div>
      <h2 style="color:var(--ink)">${ok?"🏅 Unitat superada!":"Gairebé! Necessites 4 encerts per superar la unitat."}</h2>
      <p style="margin:.6rem auto">${ok?"Pots passar a la unitat següent o repassar les targetes.":"Repassa els apartats on has fallat i torna-ho a provar: les preguntes canvien cada vegada."}</p>
      <div class="nav" style="justify-content:center"><button class="soft" id="again">Torna a fer el repte</button><button class="acc" id="home2">Torna als temes</button></div></section>`;
    wire(u);
    document.getElementById("again").onclick=()=>app.querySelector('[data-tab="quiz"]').click();
    document.getElementById("home2").onclick=()=>go({v:"home"});
    return;
  }
  const q=V.qs[V.k];
  app.innerHTML=head(u,"quiz")+`
   <div class="steps">${V.qs.map((_,k)=>`<i class="${k<V.k?"done":k===V.k?"now":""}"></i>`).join("")}</div>
   <section class="lesson"><h2>Pregunta ${V.k+1} de 5</h2><div class="q" style="font-weight:600;margin:.4rem 0 .8rem">${q.p}</div>
     <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
     <div class="fb" id="fb" aria-live="polite"></div>
     <div class="nav"><span></span><button class="acc" id="qn" hidden>${V.k<4?"Següent pregunta":"Mira el resultat"}</button></div></section>`;
  wire(u);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, fb=document.getElementById("fb");
    app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    app.querySelectorAll(".opt")[q.a].classList.add("right");
    if(k===q.a){ V.score++; fb.className="fb ok"; fb.innerHTML=`Correcte!<span>${q.x}</span>`; }
    else { b.classList.add("wrong"); fb.className="fb no"; fb.innerHTML=`No és correcte.<span>${q.x}</span>`; }
    const n=document.getElementById("qn"); n.hidden=false; n.focus();
    n.onclick=()=>{ V.k++; render(); };
  });
}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posa't a prova · Economia Bàsica 4t ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#1E2235; --muted:#5A6079; --line:#D8DCE8; --ok:#1F9461; --bad:#D2452F; --soft:#EAEEF7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11131D; --card:#1A1D2B; --ink:#E8EAF4; --muted:#A3A8C2; --line:#2D3147; --soft:#23273A; --ok:#45C08A; --bad:#F06A50; }
}
:root[data-theme="dark"]{ --bg:#11131D; --card:#1A1D2B; --ink:#E8EAF4; --muted:#A3A8C2; --line:#2D3147; --soft:#23273A; --ok:#45C08A; --bad:#F06A50; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.06rem/1.65 "Lexend",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2;font-weight:800}
.wrap{max-width:820px;margin:0 auto;padding:1.4rem 1rem 4rem}
button{font:600 1rem "Lexend",sans-serif;border:0;border-radius:12px;padding:.65rem 1.1rem;cursor:pointer;background:var(--ink);color:var(--bg)}
button.soft{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
button.acc{background:var(--c,#3B5BDB);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--c,#3B5BDB);outline-offset:2px}
.top h1{font-size:clamp(1.8rem,4.6vw,2.6rem)}
.top p{color:var(--muted);margin:.4rem 0 0;max-width:60ch}

/* Unit cards with progress rings: the memorable element */
.units{display:grid;gap:.9rem;margin-top:1.4rem}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:1rem 1.1rem;font-weight:400}
.unit:hover{border-color:var(--c)}
.unit h2{font-size:1.2rem}
.unit p{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.badge{font-size:1.6rem}

.bar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.crumbs{color:var(--muted);font-size:.95rem}
.steps{display:flex;gap:6px;margin:1rem 0}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps i.done{background:var(--c)}
.steps i.now{background:var(--c);opacity:.45}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1.3rem 1.4rem;margin-top:.6rem}
.lesson h2{font-size:1.5rem;margin-bottom:.6rem;color:var(--c)}
.lesson p{margin:.6rem 0;max-width:66ch}
.lesson ul{margin:.4rem 0;padding-left:1.2rem}
.lesson li{margin:.25rem 0}
.ex{background:var(--soft);border-radius:14px;padding:.8rem 1rem;margin:.9rem 0}
.ex b:first-child{color:var(--c)}
.formula{font-weight:800;font-size:1.15rem;background:var(--soft);border-left:5px solid var(--c);border-radius:0 12px 12px 0;padding:.6rem .9rem;margin:.8rem 0}
.check{margin-top:1.2rem;border-top:2px dashed var(--line);padding-top:1rem}
.check h3{font-size:1.05rem;color:var(--muted);font-weight:600}
.check .q{font-weight:600;margin:.3rem 0 .7rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:var(--soft);color:var(--ink);font-weight:400;border:2px solid transparent}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;opacity:.85}
.fb{margin-top:.8rem;font-weight:600;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink);margin-top:.2rem}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.tabs button[aria-pressed="true"]{background:var(--c);color:#fff}

.flash{perspective:1000px;margin-top:1rem}
.fcard{width:100%;min-height:220px;border-radius:20px;background:var(--card);border:2px solid var(--line);color:var(--ink);display:grid;place-items:center;padding:1.5rem;text-align:center;font-weight:400}
.fcard .term{font-size:1.7rem;font-weight:800;color:var(--c)}
.fcard .def{font-size:1.1rem;max-width:46ch}
.fcard small{display:block;color:var(--muted);margin-top:.8rem;font-size:.85rem}
.score{font-size:3rem;font-weight:800;color:var(--c)}
.code{background:var(--soft);border-radius:12px;padding:.8rem 1rem;font-weight:600;user-select:all}
@media (prefers-reduced-motion:no-preference){.lesson{animation:in .25s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const U=[
{id:"u1",t:"Unitat 1 · El problema",e:"🌍",c:"#3B5BDB",
 secs:[
  {t:"Escassetat o repartiment?",h:`<p>Les necessitats són <b>il·limitades</b> i els recursos, <b>limitats</b>: això és l'<b>escassetat</b>. Però de vegades sí que hi ha prou recursos i no arriben a tothom perquè no hi ha diners, propietat o accés: és un <b>problema de repartiment</b>.</p>
   <div class="ex"><b>A L'illa de les flors</b> sobren tomàquets, però hi ha persones que no en poden menjar: és un problema de repartiment.</div>`,
   q:{p:"Els supermercats llencen fruita bona mentre hi ha famílies que no en poden comprar. És un problema de…",o:["Escassetat","Repartiment","Productivitat","Oferta"],a:1,x:"Hi ha prou fruita, però no arriba a tothom: repartiment."}},
  {t:"Cost d'oportunitat i costos irrecuperables",h:`<p>El <b>cost d'oportunitat</b> és el valor de la <b>millor alternativa</b> a què renuncies quan tries.</p>
   <p>Un <b>cost irrecuperable</b> és un diner o un temps ja gastat que no pots recuperar facis el que facis. Per decidir bé, <b>no s'ha de tenir en compte</b>.</p>
   <div class="ex"><b>Exemple.</b> Ja heu pagat 50 € per una parada i no us els tornaran. Per decidir si hi aneu, només compta el que guanyareu a partir d'ara.</div>`,
   q:{p:"La cooperativa ja ha pagat 50 € (no retornables) per una parada. Per decidir si hi va, aquests 50 €…",o:["S'han de sumar als costos","No s'han de tenir en compte","Són el cost d'oportunitat","Són un ingrés"],a:1,x:"És un cost irrecuperable: es perd igualment, hi vagin o no."}},
  {t:"Pensar al marge i incentius",h:`<p>L'<b>anàlisi marginal</b> és decidir pensant en què guanyes i què et costa <b>una unitat més</b>. Val la pena continuar mentre el benefici d'una unitat més sigui igual o més gran que el seu cost.</p>
   <p>Un <b>incentiu</b> és una recompensa o un càstig que fa canviar el comportament.</p>`,
   q:{p:"Una hora més de parada costa 18 € i fa vendre 15 € més. Val la pena obrir aquesta hora?",o:["Sí, perquè es ven més","No, perquè costa més del que aporta","Sí, sempre val la pena","No es pot saber"],a:1,x:"15 € < 18 €: el benefici marginal és menor que el cost marginal."}},
  {t:"Positiu o normatiu? Micro o macro?",h:`<p><b>Positiu:</b> fets que es poden comprovar. <b>Normatiu:</b> opinions o el que hauria de ser («hauria», «cal», «és injust»).</p>
   <p><b>Micro:</b> famílies, empreses o mercats concrets. <b>Macro:</b> el conjunt d'un país (atur, inflació, PIB).</p>`,
   q:{p:"«El govern hauria de multar els supermercats que llencen menjar.» És…",o:["Positiu i micro","Normatiu","Positiu i macro","Una dada"],a:1,x:"Diu el que hauria de ser: és normatiu."}},
  {t:"Què, com i per a qui; factors de producció",h:`<p>Tota economia decideix <b>què</b> produir, <b>com</b> produir-ho i <b>per a qui</b>, buscant <b>eficiència</b> (no malbaratar) i <b>equitat</b> (repartiment just).</p>
   <p>Els <b>factors de producció</b> són la <b>terra</b> (recursos naturals), el <b>treball</b>, el <b>capital</b> (màquines i eines) i la <b>iniciativa empresarial</b>.</p>`,
   q:{p:"La màquina de cosir de la cooperativa és…",o:["Terra","Treball","Capital","Iniciativa empresarial"],a:2,x:"Les màquines i les eines que serveixen per produir són capital."}},
  {t:"Economies plurals i dades amb font",h:`<p>Mirades econòmiques: <b>circular</b> (reutilitzar i reparar), <b>ecològica</b> (límits del planeta), <b>feminista i de les cures</b> (treball de cures, que no surt al PIB) i <b>social i solidària</b> (persones abans que benefici).</p>
   <p>Una dada ben citada té <b>xifra, organisme i any</b>. Si dues dades no coincideixen, mira si són d'anys, territoris o definicions diferents.</p>`,
   q:{p:"Un taller transforma roba vella en bosses noves. Quina mirada hi encaixa més?",o:["Economia circular","Economia de les cures","Macroeconomia","Economia normativa"],a:0,x:"Reutilitzar perquè res no es llenci és economia circular."}}
 ],
 cards:[["Escassetat","Recursos limitats davant de necessitats il·limitades."],["Problema de repartiment","Hi ha prou recursos, però no arriben a tothom."],["Cost d'oportunitat","Valor de la millor alternativa a què renuncies."],["Cost irrecuperable","Diner o temps ja gastat que no es pot recuperar; no ha de decidir res."],["Anàlisi marginal","Decidir pensant en una unitat més."],["Incentiu","Recompensa o càstig que fa canviar el comportament."],["Positiu / normatiu","Fets comprovables / opinions sobre el que hauria de ser."],["Micro / macro","Agents i mercats concrets / tot un país."],["Factors de producció","Terra, treball, capital i iniciativa empresarial."],["Economia circular","Reutilitzar, reparar i reciclar perquè res no es llenci."]],
 extra:[
  {p:"Dissabte pots fer de cangur (25 €), donar classes (40 €) o repartir propaganda (15 €), però vas a la parada sense cobrar. Quin és el cost d'oportunitat?",o:["80 €","40 €","25 €","0 €"],a:1,x:"Només compta la millor alternativa: 40 €."},
  {p:"«L'atur juvenil ha baixat aquest any.» És…",o:["Micro","Macro","Normatiu","Un incentiu"],a:1,x:"Parla de tot el país: macro (i, a més, positiu)."},
  {p:"Cuinar el sopar a casa compta al PIB?",o:["Sí","No","Només si és sa","Només els caps de setmana"],a:1,x:"El PIB només compta el que es compra i es ven, tot i que cuinar és treball."},
  {p:"Quina d'aquestes cites està completa?",o:["«Es llencen 30 kg per persona.»","«Es llencen 30 kg per persona.» (2023)","«Es llencen 30 kg per persona.» Agència de Residus de Catalunya, 2023","«Segons internet, es llencen molts kg.»"],a:2,x:"Té xifra, organisme i any."}
 ]},
{id:"u2",t:"Unitat 2 · El mercat",e:"🥖",c:"#7C3AED",
 secs:[
  {t:"Productivitat i sostenibilitat",h:`<p><b>Productivitat = producció ÷ factor utilitzat</b> (per persona o per hora). La <b>divisió del treball</b> sol fer-la augmentar.</p>
   <p>Recursos <b>renovables</b> (sol, vent, cotó) i <b>no renovables</b> (petroli, gas, minerals). El <b>desenvolupament sostenible</b> no posa en perill les necessitats de les generacions futures.</p>`,
   q:{p:"3 persones fan 24 sobres. Després de repartir-se les tasques, en fan 48. Quina és la nova productivitat per persona?",o:["8","16","24","48"],a:1,x:"48 ÷ 3 = 16 sobres per persona (abans, 8)."}},
  {t:"La demanda i l'oferta",h:`<p><b>Llei de la demanda:</b> si el preu puja, la quantitat demandada baixa. <b>Llei de l'oferta:</b> si el preu puja, la quantitat oferta augmenta.</p>`,
   q:{p:"Si el preu dels pots de melmelada puja, els clients en voldran comprar…",o:["Més","Menys","Igual","El doble"],a:1,x:"Llei de la demanda."}},
  {t:"L'equilibri i els excessos",h:`<p>El <b>preu d'equilibri</b> és on la quantitat demandada és igual a l'oferta. Per sobre hi ha <b>excés d'oferta</b> (sobra producte, el preu baixa). Per sota hi ha <b>excés de demanda</b> (falta producte, el preu puja).</p>`,
   q:{p:"A 6 € es volen comprar 20 unitats i se'n volen vendre 35. Què hi ha?",o:["Equilibri","Excés de demanda","Excés d'oferta","Punt mort"],a:2,x:"Sobren 15 unitats: excés d'oferta."}},
  {t:"Desplaçaments de les corbes",h:`<p>Si canvia el preu, ens movem per la corba. Si canvia una altra cosa, la corba es desplaça. Canvis en els <b>compradors</b> (renda, modes, festes) mouen la <b>demanda</b>; canvis en els <b>productors</b> (costos, tecnologia, clima) mouen l'<b>oferta</b>.</p>`,
   q:{p:"La tela reciclada s'encareix molt. Què passa?",o:["Augmenta la demanda","Baixa l'oferta i el preu puja","Augmenta l'oferta","No canvia res"],a:1,x:"Puja un cost de producció: l'oferta baixa i el preu d'equilibri puja."}},
  {t:"El flux circular de la renda",h:`<p><b>Famílies</b> (consumeixen i ofereixen treball), <b>empreses</b> (produeixen i contracten) i <b>sector públic</b> (impostos i serveis públics). Al <b>mercat de béns</b> es compren productes; al <b>mercat de factors</b>, treball i recursos.</p>`,
   q:{p:"La cooperativa compra tela a una botiga del barri. Qui actua com a comprador?",o:["Una família","Una empresa","El sector públic","Ningú"],a:1,x:"La cooperativa és una empresa que compra un recurs per produir."}},
  {t:"De l'enquesta a la demanda",h:`<p>A cada preu, la <b>quantitat demandada</b> és el nombre de persones que pagarien <b>aquest preu o més</b>. <b>Ingressos previstos = preu × quantitat demandada.</b> L'enquesta ha de tenir prou respostes (20 o més) i perfils diferents.</p>`,
   q:{p:"Preu màxim: 3 € (5 persones), 4 € (7), 5 € (4), 6 € (2). Quantes comprarien a 4 €?",o:["7","13","18","2"],a:1,x:"Els que pagarien 4 € o més: 7 + 4 + 2 = 13."}}
 ],
 cards:[["Productivitat","Producció ÷ factor utilitzat."],["Divisió del treball","Cadascú s'especialitza en una tasca."],["Recurs renovable","Es regenera de manera natural."],["Desenvolupament sostenible","Satisfer les necessitats d'avui sense comprometre les del futur."],["Llei de la demanda","Si el preu puja, la quantitat demandada baixa."],["Llei de l'oferta","Si el preu puja, la quantitat oferta augmenta."],["Preu d'equilibri","On quantitat demandada = quantitat oferta."],["Excés d'oferta","Sobra producte: el preu tendeix a baixar."],["Excés de demanda","Falta producte: el preu tendeix a pujar."],["Flux circular","Circuit de béns, treball i diners entre famílies i empreses."]],
 extra:[
  {p:"Arriba la festa major i tothom vol comprar més. Què passa?",o:["La demanda augmenta i el preu puja","L'oferta baixa","La demanda baixa","El preu baixa"],a:0,x:"Canvia una cosa dels compradors: la demanda augmenta."},
  {p:"El petroli és un recurs…",o:["Renovable","No renovable","Lliure","Il·limitat"],a:1,x:"S'esgota."},
  {p:"Si el preu està per sota de l'equilibri…",o:["Sobra producte","Falta producte i el preu tendeix a pujar","El preu baixa","Hi ha equilibri"],a:1,x:"Excés de demanda."},
  {p:"Amb 13 compradors a 4 €, quins ingressos es preveuen?",o:["17 €","52 €","13 €","40 €"],a:1,x:"4 × 13 = 52 €."}
 ]},
{id:"u3",t:"Unitat 3 · El pla",e:"🧮",c:"#C2410C",
 secs:[
  {t:"Costos, ingressos i benefici",h:`<p><b>Costos fixos</b>: no canvien amb la producció. <b>Costos variables</b>: augmenten com més es produeix.</p>
   <div class="formula">Cost total = CF + CVu × quantitat</div><div class="formula">Benefici = preu × quantitat − cost total</div>`,
   q:{p:"«Espelmes Corbatera»: CF 115 €, CVu 2,80 €, venen 60 espelmes a 8 €. Quin és el benefici?",o:["480 €","283 €","197 €","365 €"],a:2,x:"Ingressos 480 €; cost total 115 + 168 = 283 €; benefici 197 €."}},
  {t:"Punt mort i tres escenaris",h:`<div class="formula">Punt mort = CF ÷ (preu − CVu)</div>
   <p>El pla de viabilitat calcula el resultat en tres <b>escenaris</b>: pessimista, realista i optimista. Si un escenari queda per sota del punt mort, té pèrdues.</p>`,
   q:{p:"CF = 115 €, preu = 8 €, CVu = 2,80 €. Quin és el punt mort?",o:["14 unitats","23 unitats","41 unitats","115 unitats"],a:1,x:"115 ÷ 5,20 = 22,1 → 23 unitats (s'arrodoneix cap amunt)."}},
  {t:"Formes jurídiques",h:`<p><b>Autònom/a:</b> responsabilitat il·limitada. <b>SL:</b> des d'1 € de capital; responsabilitat limitada al capital (si és de menys de 3.000 €, fins a 3.000 €). <b>SA:</b> capital mínim 60.000 €, en accions. <b>Cooperativa catalana:</b> capital mínim 3.000 €, responsabilitat limitada, un soci un vot.</p>`,
   q:{p:"Qui respon dels deutes amb els seus béns personals?",o:["Els socis d'una SL","Un empresari autònom","Els accionistes d'una SA","Els socis d'una cooperativa"],a:1,x:"L'autònom té responsabilitat il·limitada."}},
  {t:"Cooperativa, principis i organigrama",h:`<p>Principis: <b>adhesió voluntària</b>, <b>gestió democràtica</b> (un soci, un vot), <b>participació econòmica</b>, <b>educació i formació</b> i <b>compromís amb la comunitat</b>.</p>
   <p>Elements de l'empresa: <b>persones</b>, <b>capital</b>, <b>organització</b> (organigrama) i <b>entorn</b>. Rols: Coordinació, Dades, Tresoreria i Comunicació.</p>`,
   q:{p:"A la cooperativa, la sòcia que ha aportat més capital té…",o:["Més vots","Un vot, com tothom","Dret a decidir sola","Cap vot"],a:1,x:"Gestió democràtica: un soci, un vot."}},
  {t:"RSC i rentat verd",h:`<p>La <b>RSC</b> són compromisos amb les persones i el planeta més enllà de la llei. El <b>rentat verd</b> és dir que ets ecològic sense proves. Un bon compromís és <b>mesurable</b>: què, quant i quan.</p>`,
   q:{p:"Quin compromís és mesurable?",o:["Serem molt sostenibles","Cuidarem el planeta","Reutilitzarem 50 pots aquest trimestre","Ens importa el medi ambient"],a:2,x:"Diu què, quant i quan."}}
 ],
 cards:[["Cost fix","No canvia amb la quantitat produïda."],["Cost variable","Augmenta com més es produeix."],["Benefici","Ingressos − cost total."],["Punt mort","CF ÷ (preu − CVu): ni es guanya ni es perd."],["Escenaris","Pessimista, realista i optimista."],["Responsabilitat il·limitada","Respondre dels deutes amb els béns personals."],["Cooperativa catalana","Capital mínim de 3.000 €, un soci un vot."],["Organigrama","Esquema de qui fa què a l'empresa."],["RSC","Compromisos amb les persones i el planeta més enllà de la llei."],["Rentat verd","Presentar-se com a ecològic sense proves."]],
 extra:[
  {p:"El lloguer de la parada és un cost…",o:["Fix","Variable","Irrecuperable sempre","Unitari"],a:0,x:"No depèn de quantes unitats es facin."},
  {p:"En l'escenari pessimista es venen menys unitats que el punt mort. Què passa?",o:["Benefici","Pèrdues","Ni benefici ni pèrdues","Més ingressos que costos"],a:1,x:"Per sota del punt mort hi ha pèrdues."},
  {p:"Quin capital mínim cal per a una cooperativa catalana?",o:["1 €","3.000 €","60.000 €","No cal capital"],a:1,x:"3.000 €."},
  {p:"«Som 100 % naturals», sense cap dada. És…",o:["RSC","Rentat verd","Un compromís mesurable","Una dada amb font"],a:1,x:"Sense proves, és rentat verd."}
 ]}
];

const KEY="repas-teoria-v3";
let P={done:{},best:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.done) P=s; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} };
const app=document.getElementById("app");
let view={v:"home"};

function pct(u){ const d=u.secs.filter((_,i)=>P.done[u.id+"-"+i]).length; const r=(P.best[u.id]||0)>=4?1:0; return Math.round((d+r)/(u.secs.length+1)*100); }
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function go(v){ view=v; render(); scrollTo({top:0}); }

function render(){
  if(view.v==="home") return home();
  const u=U.find(x=>x.id===view.u); app.style.setProperty("--c",u.c); document.body.style.setProperty("--c",u.c);
  ({sec:lesson, cards:cards, quiz:quiz})[view.v](u);
}

function home(){
  const tot=Math.round(U.reduce((a,u)=>a+pct(u),0)/U.length);
  app.innerHTML=`<header class="top"><h1>Posa't a prova</h1>
    <p>Repassa cada unitat de la SA «Res no es llença», comprova que l'has entesa i supera el repte final. Avances al teu ritme i el progrés es guarda en aquest ordinador.</p></header>
    <div class="units">${U.map(u=>{ const p=pct(u), m=(P.best[u.id]||0)>=4;
      return `<button class="unit" style="--c:${u.c}" data-u="${u.id}">
        <div class="ring" style="--p:${p}"><span>${p}%</span></div>
        <div><h2>${u.e} ${u.t}</h2><p>${u.secs.length} apartats · targetes · repte${P.best[u.id]!==undefined?` · millor resultat ${P.best[u.id]}/5`:""}</p></div>
        <span class="badge" aria-label="${m?"Unitat superada":""}">${m?"🏅":""}</span></button>`; }).join("")}</div>
    <section class="lesson" style="margin-top:1.4rem">
      <h2 style="color:var(--ink)">El teu progrés: ${tot} %</h2>
      <p>Copia aquesta línia a Classroom quan t'ho demani la professora:</p>
      <div class="code">${U.map(u=>`${u.e} ${pct(u)}%${(P.best[u.id]||0)>=4?" 🏅":""}`).join(" · ")}</div>
    </section>`;
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const u=U.find(x=>x.id===b.dataset.u); let i=u.secs.findIndex((_,k)=>!P.done[u.id+"-"+k]); if(i<0) i=0;
    go({v:"sec",u:u.id,i});
  });
}

function head(u,active){
  return `<div class="bar"><button class="soft" data-home>← Unitats</button><span class="crumbs">${u.e} ${u.t}</span></div>
  <div class="tabs">
    <button class="soft" data-tab="sec" aria-pressed="${active==="sec"}">Teoria</button>
    <button class="soft" data-tab="cards" aria-pressed="${active==="cards"}">Targetes</button>
    <button class="soft" data-tab="quiz" aria-pressed="${active==="quiz"}">Repte final</button></div>`;
}
function wire(u){
  app.querySelector("[data-home]").onclick=()=>go({v:"home"});
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.tab;
    if(t==="sec") go({v:"sec",u:u.id,i:0});
    if(t==="cards") go({v:"cards",u:u.id,k:0,flip:false,order:shuffle(u.cards.map((_,i)=>i))});
    if(t==="quiz") go({v:"quiz",u:u.id,qs:shuffle([...u.secs.map(s=>s.q),...u.extra]).slice(0,5),k:0,score:0,ans:null});
  });
}

function lesson(u){
  const i=view.i, s=u.secs[i], done=!!P.done[u.id+"-"+i];
  app.innerHTML=head(u,"sec")+`
   <div class="steps">${u.secs.map((_,k)=>`<i class="${P.done[u.id+"-"+k]?"done":k===i?"now":""}"></i>`).join("")}</div>
   <article class="lesson">
     <h2>${i+1}. ${s.t}</h2>${s.h}
     <div class="check"><h3>Comprova-ho</h3><div class="q">${s.q.p}</div>
       <div class="opts">${s.q.o.map((o,k)=>`<button class="opt${done&&k===s.q.a?" right":""}" data-k="${k}" ${done?"disabled":""}>${o}</button>`).join("")}</div>
       <div class="fb${done?" ok":""}" id="fb" aria-live="polite">${done?`Correcte!<span>${s.q.x}</span>`:""}</div></div>
   </article>
   <div class="nav">
     <button class="soft" id="prev" ${i===0?"disabled":""}>Apartat anterior</button>
     ${i<u.secs.length-1?`<button class="acc" id="next" ${done?"":"disabled"}>Apartat següent</button>`:`<button class="acc" id="toQuiz" ${done?"":"disabled"}>Fes el repte final</button>`}
   </div>`;
  wire(u);
  let tries=0;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, fb=document.getElementById("fb");
    if(k===s.q.a){
      b.classList.add("right"); app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      fb.className="fb ok"; fb.innerHTML=`Correcte!<span>${s.q.x}</span>`;
      P.done[u.id+"-"+i]=true; save();
      const n=document.getElementById("next")||document.getElementById("toQuiz"); n.disabled=false; n.focus();
    } else {
      tries++; b.classList.add("wrong"); b.disabled=true;
      fb.className="fb no"; fb.innerHTML= tries>=2 ? `Encara no.<span>Pista: ${s.q.x.split(":")[0]}. Rellegeix l'apartat i torna-ho a provar.</span>` : `No és correcte. Torna a llegir l'apartat i prova una altra resposta.`;
    }
  });
  document.getElementById("prev").onclick=()=>go({v:"sec",u:u.id,i:i-1});
  const n=document.getElementById("next"); if(n) n.onclick=()=>go({v:"sec",u:u.id,i:i+1});
  const q=document.getElementById("toQuiz"); if(q) q.onclick=()=>app.querySelector('[data-tab="quiz"]').click();
}

function cards(u){
  const k=view.k, c=u.cards[view.order[k]];
  app.innerHTML=head(u,"cards")+`
    <p class="note" style="color:var(--muted);margin-top:1rem">Intenta recordar la definició abans de girar la targeta.</p>
    <div class="flash"><button class="fcard" id="fc" aria-live="polite">${view.flip?`<div><div class="def">${c[1]}</div><small>${c[0]}</small></div>`:`<div><div class="term">${c[0]}</div><small>Toca per girar</small></div>`}</button></div>
    <div class="nav"><button class="soft" id="cp" ${k===0?"disabled":""}>Anterior</button><span class="crumbs">${k+1} / ${u.cards.length}</span><button class="acc" id="cn">${k<u.cards.length-1?"Següent":"Torna a començar"}</button></div>`;
  wire(u);
  document.getElementById("fc").onclick=()=>{ view.flip=!view.flip; render(); document.getElementById("fc").focus(); };
  document.getElementById("cp").onclick=()=>{ view.k--; view.flip=false; render(); };
  document.getElementById("cn").onclick=()=>{ if(view.k<u.cards.length-1){ view.k++; } else { view.k=0; view.order=shuffle(view.order); } view.flip=false; render(); };
}

function quiz(u){
  const V=view;
  if(V.k>=V.qs.length){
    const prev=P.best[u.id]; if(prev===undefined||V.score>prev){ P.best[u.id]=V.score; save(); }
    const ok=V.score>=4;
    app.innerHTML=head(u,"quiz")+`<section class="lesson" style="text-align:center">
      <div class="score">${V.score} / 5</div>
      <h2 style="color:var(--ink)">${ok?"🏅 Unitat superada!":"Gairebé! Necessites 4 encerts per superar la unitat."}</h2>
      <p style="margin:.6rem auto">${ok?"Pots passar a la unitat següent o repassar les targetes.":"Repassa els apartats on has fallat i torna-ho a provar: les preguntes canvien cada vegada."}</p>
      <div class="nav" style="justify-content:center"><button class="soft" id="again">Torna a fer el repte</button><button class="acc" id="home2">Torna a les unitats</button></div></section>`;
    wire(u);
    document.getElementById("again").onclick=()=>app.querySelector('[data-tab="quiz"]').click();
    document.getElementById("home2").onclick=()=>go({v:"home"});
    return;
  }
  const q=V.qs[V.k];
  app.innerHTML=head(u,"quiz")+`
   <div class="steps">${V.qs.map((_,k)=>`<i class="${k<V.k?"done":k===V.k?"now":""}"></i>`).join("")}</div>
   <section class="lesson"><h2>Pregunta ${V.k+1} de 5</h2><div class="q" style="font-weight:600;margin:.4rem 0 .8rem">${q.p}</div>
     <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
     <div class="fb" id="fb" aria-live="polite"></div>
     <div class="nav"><span></span><button class="acc" id="qn" hidden>${V.k<4?"Següent pregunta":"Mira el resultat"}</button></div></section>`;
  wire(u);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, fb=document.getElementById("fb");
    app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    app.querySelectorAll(".opt")[q.a].classList.add("right");
    if(k===q.a){ V.score++; fb.className="fb ok"; fb.innerHTML=`Correcte!<span>${q.x}</span>`; }
    else { b.classList.add("wrong"); fb.className="fb no"; fb.innerHTML=`No és correcte.<span>${q.x}</span>`; }
    const n=document.getElementById("qn"); n.hidden=false; n.focus();
    n.onclick=()=>{ V.k++; render(); };
  });
}
render();
</script>
</body>
</html>

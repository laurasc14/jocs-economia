<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qui vol ser ric? Economia 4t ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#14113A; --panel:#211D57; --panel-2:#2E2974; --ink:#F2F0FF; --muted:#AFA9E0;
  --gold:#F3C44B; --ok:#3BB273; --bad:#E0524C; --sel:#E98A2E;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E0C2A; --panel:#1C1850; } }
:root[data-theme="dark"]{ --bg:#0E0C2A; --panel:#1C1850; }
:root[data-theme="light"]{ --bg:#14113A; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a33a0 0,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font:400 1.1rem/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.stage{max-width:1180px;margin:0 auto;padding:1.2rem 1rem 3rem;display:grid;grid-template-columns:1fr 250px;gap:1.4rem}
h1{font:900 clamp(1.6rem,3.6vw,2.6rem)/1 "Fraunces",Georgia,serif;margin:0 0 1rem;color:var(--gold)}
.lifelines{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.2rem}
button{font:700 1rem "Atkinson Hyperlegible",sans-serif;cursor:pointer;border:0;color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.life{background:var(--panel-2);border-radius:999px;padding:.6rem 1rem;box-shadow:inset 0 0 0 2px var(--gold)}
.life:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.timer{font:900 2rem "Fraunces",serif;color:var(--gold);min-height:2.6rem;font-variant-numeric:tabular-nums}
.qbox{background:var(--panel);border-radius:22px;padding:1.4rem 1.5rem;box-shadow:inset 0 0 0 2px var(--panel-2)}
.qmeta{color:var(--muted);font-size:.95rem}
.qtext{font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:700;margin:.4rem 0 0;max-width:40ch}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.1rem}
.ans{text-align:left;background:var(--panel);border-radius:14px;padding:1rem 1.1rem;box-shadow:inset 0 0 0 2px var(--panel-2);display:flex;gap:.7rem;align-items:baseline;min-height:4rem;transition:background .2s}
.ans b{color:var(--gold);font-family:"Fraunces",serif}
.ans:hover:not(:disabled){background:var(--panel-2)}
.ans.sel{background:var(--sel);color:#1f1200}.ans.sel b{color:#1f1200}
.ans.ok{background:var(--ok);color:#fff}.ans.ok b{color:#fff}
.ans.bad{background:var(--bad);color:#fff}.ans.bad b{color:#fff}
.ans.gone{visibility:hidden}
.ans:disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.1rem;align-items:center}
.main{background:var(--gold);color:#241a00;border-radius:12px;padding:.8rem 1.2rem}
.main:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border-radius:12px;padding:.8rem 1.1rem;box-shadow:inset 0 0 0 2px var(--muted);color:var(--muted)}
.feedback{margin-top:1rem;min-height:1.5em;font-weight:700}
.explain{color:var(--muted);font-weight:400;display:block;margin-top:.3rem}

/* The ladder: the memorable element */
.ladder{list-style:none;margin:0;padding:.8rem;background:var(--panel);border-radius:22px;display:flex;flex-direction:column-reverse;gap:.25rem;align-self:start}
.ladder li{display:flex;justify-content:space-between;padding:.35rem .8rem;border-radius:10px;color:var(--muted);font:700 1.05rem "Fraunces",serif;font-variant-numeric:tabular-nums}
.ladder li.safe{color:var(--ink)}
.ladder li.done{color:var(--gold)}
.ladder li.now{background:var(--gold);color:#241a00}
.ladder small{font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;opacity:.8}

.overlay{position:fixed;inset:0;background:rgba(10,8,30,.85);display:none;place-items:center;padding:1rem;z-index:5}
.overlay.show{display:grid}
.card{background:var(--panel);border-radius:24px;padding:2rem;max-width:520px;text-align:center;box-shadow:inset 0 0 0 3px var(--gold)}
.card h2{font:900 2rem "Fraunces",serif;margin:0 0 .5rem;color:var(--gold)}
.card .money{font:900 3rem "Fraunces",serif}
.card p{color:var(--muted)}
@media (max-width:820px){.stage{grid-template-columns:1fr}.ladder{flex-direction:column-reverse;order:-1;display:grid;grid-template-columns:repeat(5,1fr)}.ladder li{justify-content:center;font-size:.85rem;padding:.3rem}.ladder small{display:none}}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ans{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <section>
    <h1>Qui vol ser ric?</h1>
    <div class="lifelines">
      <button class="life" id="l50">50 %</button>
      <button class="life" id="lclass">Pregunta a la classe</button>
      <button class="life" id="lcall">Truca a un company</button>
      <button class="life" id="lswap">Canvia la pregunta</button>
    </div>
    <div class="timer" id="timer" aria-live="polite"></div>
    <div class="qbox">
      <div class="qmeta" id="qmeta"></div>
      <p class="qtext" id="qtext"></p>
    </div>
    <div class="answers" id="answers"></div>
    <div class="actions">
      <button class="main" id="final" disabled>És la meva resposta definitiva</button>
      <button class="main" id="next" hidden>Següent pregunta</button>
      <button class="ghost" id="stop">Em planto</button>
      <button class="ghost" id="restart">Partida nova</button>
    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>
  </section>
  <ol class="ladder" id="ladder" aria-label="Escala de premis"></ol>
</main>

<div class="overlay" id="over"><div class="card">
  <h2 id="oTitle"></h2><div class="money" id="oMoney"></div><p id="oText"></p>
  <button class="main" id="oBtn">Partida nova</button>
</div></div>

<script>
const PRIZES=[100,200,500,1000,2000,5000,10000,50000,100000,1000000];
const SAFE=[3,6];
// [pregunta, [opcions], índex correcte, explicació]
const BANK={
1:[
 ["A «L'illa de les flors» sobren tomàquets però hi ha persones que no en mengen. És un problema de…",["Escassetat","Repartiment","Productivitat","Inflació"],1,"Hi ha prou tomàquets: el problema és que no arriben a tothom."],
 ["Quin d'aquests és un factor de producció?",["El preu","El treball","El benefici","L'enquesta"],1,"Terra, treball, capital i iniciativa empresarial."],
 ["En una cooperativa, quants vots té cada persona sòcia?",["Segons els diners que ha posat","Un vot","Cap","Dos vots"],1,"Un soci, un vot: gestió democràtica."],
 ["El lloguer de la parada és un cost…",["Fix","Variable","Irrecuperable sempre","Marginal"],0,"Es paga igual tant si veneu molt com si no veneu res."],
 ["«Les botigues haurien de donar el menjar que sobra» és una afirmació…",["Positiva","Normativa","Macroeconòmica","Falsa"],1,"Expressa el que hauria de ser."],
 ["Reparar mòbils perquè no es llencin és un exemple d'economia…",["Circular","Feminista","Macro","Negativa"],0,"Allargar la vida dels productes és economia circular."],
 ["Quin d'aquests recursos és renovable?",["El petroli","El gas natural","L'energia solar","El liti"],2,"El sol no s'esgota."],
 ["Segons la llei de la demanda, si el preu puja, la quantitat demandada…",["Puja","Baixa","No canvia","Es duplica"],1,"Els consumidors compren menys quan és més car."]
],
2:[
 ["Què és el cost d'oportunitat?",["El preu del producte","El valor de la millor alternativa a què renuncies","La suma de totes les alternatives","Un cost que ja no es pot recuperar"],1,"Només compta la millor alternativa."],
 ["Vau pagar 50 € per una parada que no us tornaran. Per decidir si hi aneu, aquests 50 €…",["Són decisius","No han de comptar: són un cost irrecuperable","S'han de sumar als ingressos","Són el cost d'oportunitat"],1,"Ja estan gastats facis el que facis."],
 ["Una hora més de parada fa vendre 15 € i costa 18 €. Què diu l'anàlisi marginal?",["Obrir-la","No obrir-la","Obrir dues hores més","És igual"],1,"El benefici marginal és més petit que el cost marginal."],
 ["4 persones fan 32 bosses. Quina és la productivitat per persona?",["4","8","28","128"],1,"32 ÷ 4 = 8 bosses per persona."],
 ["Si la tela s'encareix, què passa al mercat de bosses?",["Augmenta la demanda","Baixa l'oferta i el preu puja","Baixa la demanda","Augmenta l'oferta"],1,"Un cost més alt redueix l'oferta."],
 ["A un preu, es volen comprar 50 unitats i se n'ofereixen 30. Què hi ha?",["Excés d'oferta","Excés de demanda","Equilibri","Punt mort"],1,"Falta producte: el preu tendirà a pujar."],
 ["Al flux circular, què ofereixen les famílies a les empreses?",["Impostos","Treball","Accions","Subvencions"],1,"Treball a canvi de salaris, al mercat de factors."],
 ["Quin capital mínim cal per constituir una cooperativa a Catalunya?",["1 €","3.000 €","60.000 €","No cal capital"],1,"La SL des d'1 € i la SA amb 60.000 €."]
],
3:[
 ["CF = 300 €, preu = 10 €, CVu = 4 €. Quin és el punt mort?",["30 unitats","50 unitats","75 unitats","21 unitats"],1,"300 ÷ (10 − 4) = 50 unitats."],
 ["Espelmes Corbatera: CF 115 €, CVu 2,80 €, venen 60 espelmes a 8 €. Benefici?",["197 €","283 €","480 €","312 €"],0,"480 − (115 + 168) = 197 €."],
 ["Enquesta: 3 persones pagarien com a màxim 2 €, 5 persones 3 € i 4 persones 4 €. Quantes comprarien a 3 €?",["5","8","9","12"],2,"Les de 3 € i les de 4 €: 5 + 4 = 9."],
 ["Punt mort: 30 unitats. Escenaris: pessimista 25, realista 40, optimista 60. Quin dona pèrdues?",["Cap","El pessimista","El pessimista i el realista","Tots"],1,"Només 25 queda per sota del punt mort."],
 ["Un autònom no pot pagar un deute del negoci. Amb què respon?",["Només amb el negoci","També amb els seus béns personals","Ho paga l'Estat","Amb el capital de 3.000 €"],1,"Responsabilitat il·limitada."],
 ["Quin d'aquests compromisos de RSC és mesurable?",["Serem molt sostenibles","Reutilitzarem com a mínim 50 pots aquest trimestre","Cuidarem el planeta","Som 100 % naturals"],1,"Diu què, quant i quan."],
 ["Cuinar el sopar a casa compta al PIB?",["Sí, sempre","No, però és treball de cures","Només si es cuina per a més de 4 persones","Només a Catalunya"],1,"El PIB només compta el que es compra i es ven."],
 ["La productivitat passa de 8 a 12 unitats per persona. En quin percentatge ha augmentat?",["4 %","33 %","50 %","150 %"],2,"(12 − 8) ÷ 8 × 100 = 50 %."]
]};

const $=id=>document.getElementById(id);
let game, sel=null, timerInt=null;

function pick(arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function eur(n){return n.toLocaleString("ca-ES")+" €";}

function newGame(){
  const l1=pick(BANK[1],5), l2=pick(BANK[2],4), l3=pick(BANK[3],4);
  game={qs:[...l1.slice(0,4),...l2.slice(0,3),...l3.slice(0,3)],
        spare:{1:l1[4],2:l2[3],3:l3[3]}, i:0, used:{}, over:false};
  ["l50","lclass","lcall","lswap"].forEach(id=>$(id).disabled=false);
  $("over").classList.remove("show");
  buildLadder(); showQ();
}
function level(i){return i<4?1:i<7?2:3;}
function buildLadder(){
  $("ladder").innerHTML=PRIZES.map((p,i)=>`<li class="${SAFE.includes(i)?'safe':''}"><small>${i+1}</small>${eur(p)}</li>`).join("");
}
function paintLadder(){
  [...$("ladder").children].forEach((li,i)=>{li.classList.toggle("now",i===game.i);li.classList.toggle("done",i<game.i);});
}
function showQ(){
  stopTimer(); sel=null;
  const q=game.qs[game.i];
  $("qmeta").textContent=`Pregunta ${game.i+1} de 10 · per ${eur(PRIZES[game.i])}`;
  $("qtext").textContent=q[0];
  $("answers").innerHTML=q[1].map((a,k)=>`<button class="ans" data-k="${k}"><b>${"ABCD"[k]}</b><span>${a}</span></button>`).join("");
  $("final").disabled=true; $("final").hidden=false; $("next").hidden=true; $("stop").disabled=false;
  $("fb").innerHTML=""; paintLadder();
}
$("answers").addEventListener("click",e=>{
  const b=e.target.closest(".ans"); if(!b||b.disabled) return;
  document.querySelectorAll(".ans").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel"); sel=+b.dataset.k; $("final").disabled=false;
});
function safePrize(){let p=0;SAFE.forEach(s=>{if(game.i>s)p=PRIZES[s];});return p;}
$("final").onclick=()=>{
  if(sel===null) return;
  stopTimer();
  const q=game.qs[game.i], btns=document.querySelectorAll(".ans");
  btns.forEach(b=>b.disabled=true);
  btns[q[2]].classList.add("ok");
  $("final").hidden=true; $("stop").disabled=true;
  if(sel===q[2]){
    $("fb").innerHTML=`Correcte!<span class="explain">${q[3]}</span>`;
    if(game.i===9){ setTimeout(()=>end("Milionaris de l'economia!",PRIZES[9],"Heu encertat les deu preguntes."),900); }
    else $("next").hidden=false;
  } else {
    btns[sel].classList.add("bad");
    $("fb").innerHTML=`No és correcte.<span class="explain">${q[3]}</span>`;
    const s=safePrize();
    setTimeout(()=>end("Fi de la partida",s,s?"Us emporteu el premi de l'últim esglaó segur.":"No heu arribat a cap esglaó segur. A la propera!"),2200);
  }
};
$("next").onclick=()=>{game.i++;showQ();};
$("stop").onclick=()=>{
  const p=game.i?PRIZES[game.i-1]:0;
  if(confirm(`Segur que us planteu amb ${eur(p)}?`)) end("Us heu plantat",p,"Una decisió prudent també és economia.");
};
$("restart").onclick=()=>{if(confirm("Començar una partida nova?")) newGame();};
$("oBtn").onclick=newGame;
function end(t,m,txt){stopTimer();$("oTitle").textContent=t;$("oMoney").textContent=eur(m);$("oText").textContent=txt;$("over").classList.add("show");$("oBtn").focus();}

// Comodins
$("l50").onclick=()=>{
  const q=game.qs[game.i]; const wrong=[0,1,2,3].filter(k=>k!==q[2]);
  pick(wrong,2).forEach(k=>{const b=document.querySelectorAll(".ans")[k];b.classList.add("gone");b.disabled=true;b.classList.remove("sel");if(sel===k){sel=null;$("final").disabled=true;}});
  $("l50").disabled=true;
};
$("lclass").onclick=()=>{ $("lclass").disabled=true; countdown(20,"Votació a mà alçada"); };
$("lcall").onclick=()=>{ $("lcall").disabled=true; countdown(30,"Trucada al company"); };
$("lswap").onclick=()=>{
  const lv=level(game.i); game.qs[game.i]=game.spare[lv]; $("lswap").disabled=true; showQ();
};
function countdown(s,label){
  stopTimer(); let t=s; $("timer").textContent=`${label}: ${t}`;
  timerInt=setInterval(()=>{t--; $("timer").textContent=t>0?`${label}: ${t}`:`${label}: temps!`; if(t<=0) clearInterval(timerInt);},1000);
}
function stopTimer(){clearInterval(timerInt);$("timer").textContent="";}
newGame();
</script>
</body>
</html>
